  <style>
    /* Página general */
    body {
      background: #0f1115;
      color: #eeeeee;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }

    h1 {
      color: #e8b34a;
      font-size: 22px;
    }

    p {
      color: #999999;
      font-size: 13px;
    }

    /* Buscador */
    input {
      background: #171a21;
      color: #eeeeee;
      border: 1px solid #2a2e38;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
      margin-bottom: 16px;
    }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #171a21;
      border-radius: 8px;
    }

    th {
      background: #1f232c;
      color: #e8b34a;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid #2a2e38;
    }

    tr:hover {
      background: #1d212a;
    }

    /* Botones */
    button {
      background: #e8b34a;
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      margin-right: 6px;
    }

    button:hover {
      opacity: 0.85;
    }

    /* Selectores */
    select {
      background: #171a21;
      color: #eeeeee;
      border: 1px solid #2a2e38;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      margin-right: 6px;
    }

    /* Botón editar en la tabla */
    .btn-editar {
      background: #2a2e38;
      color: #e8b34a;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-editar:hover {
      background: #e8b34a;
      color: #1a1a1a;
    }

    /* Modal */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);   /* corregido: rga → rgba */
      display: flex;                      /* corregido: felx → flex */
      align-items: center;
      justify-content: center;
    }

    #modalContenido {
      background: #1f232c;
      border: 1px solid #2a2e38;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }

    #modalContenido h2 {
      color: #e8b34a;
      font-size: 16px;
      margin: 0 0 16px;
    }

    #modalContenido input {
      margin-bottom: 10px;
    }

    #btnEliminar {
      background: #e05555;
      color: #ffffff;
    }

    #btnCerrarModal {
      background: #2a2e38;
      color: #eeeeee;
    }
  </style>
</head>

    <button id="btnGuardar">Guardar</button>

    function cargarDatos() {

          return JSON.parse(guardado);
        }
      } catch(e) {}
      return canciones.slice(); // copia del array original
    }

    function guardarDatos() {
      try {
        localStorage.setItem('repertorio', JSON.stringify(lista));
      } catch(e) {}
    }

    let lista = cargarDatos();
    let indiceEditando = null;

    // 3. SELECTORES
    function llenarSelector(selector, campo) {
      const etiqueta = campo === 'ritmo' ? 'Ritmo' : 'Intérprete';
      selector.innerHTML = '<option value="">' + etiqueta + ' (todos)</option>';
      const valores = [];
      lista.forEach(function(item) {
        if (item[campo] && !valores.includes(item[campo])) {
          valores.push(item[campo]);
        }
      });
      valores.sort(function(a, b) {
        return a.localeCompare(b, 'es');
      });
      valores.forEach(function(valor) {
        const opcion = document.createElement('option');
        opcion.value = valor;
        opcion.textContent = valor;
        selector.appendChild(opcion);
      });
    }

    function actualizarSelectores() {
      llenarSelector(filtroRitmo,      'ritmo');
      llenarSelector(filtroInterprete, 'interprete');
    }

        const fila = document.createElement('tr');
        fila.innerHTML =
          '<td>' + (item.cancion    || '') + '</td>' +
          '<td>' + (item.artista    || '') + '</td>' +
          '<td>' + (item.ritmo      || '') + '</td>' +
          '<td>' + (item.interprete || '') + '</td>' +
          '<td><button class="btn-editar" data-indice="' + indice + '">✎</button></td>';
        cuerpo.appendChild(fila);
      });
      // corregido: 'btn-editar' → '.btn-editar'
      document.querySelectorAll('.btn-editar').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const indice = parseInt(btn.dataset.indice);   // corregido: cont → const
          abrirModal(indice);
        });
      });
      // Actualizar contador
      document.getElementById('totalCanciones').textContent = lista.length;
    }

    // 5. FILTRAR
    function sinAcentos(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function filtrar() {
      const texto      = sinAcentos(buscador.value.toLowerCase());
      const ritmo      = filtroRitmo.value;
      const interprete = filtroInterprete.value;

      const resultado = lista.filter(function(item) {
        const contenido = sinAcentos(
          (item.cancion    || '') + ' ' +
          (item.artista    || '') + ' ' +
          (item.ritmo      || '') + ' ' +
          (item.interprete || '')
        ).toLowerCase();
        const pasaTexto      = contenido.includes(texto);
        const pasaRitmo      = (ritmo      === '') || (item.ritmo      === ritmo);
        const pasaInterprete = (interprete === '') || (item.interprete === interprete);
        return pasaTexto && pasaRitmo && pasaInterprete;
      });
      dibujarTabla(resultado);
    }

    // 6. FORMULARIO — agregar
    btnAgregar.addEventListener('click', function() {
      formulario.style.display = 'block';
    });

    btnCancelar.addEventListener('click', function() {
      formulario.style.display = 'none';
      limpiarFormulario();
    });

    function limpiarFormulario() {
      document.getElementById('nuevaCancion').value    = '';
      document.getElementById('nuevoArtista').value    = '';
      document.getElementById('nuevoRitmo').value      = '';
      document.getElementById('nuevoInterprete').value = '';
    }

    btnGuardar.addEventListener('click', function() {
      const cancion = document.getElementById('nuevaCancion').value.trim();
      if (cancion === '') {
        alert('El nombre de la canción no puede estar vacío.');
        return;
      }
      lista.push({
        cancion:    cancion,
        artista:    document.getElementById('nuevoArtista').value.trim()    || null,
        ritmo:      document.getElementById('nuevoRitmo').value.trim()      || null,
        interprete: document.getElementById('nuevoInterprete').value.trim() || null,
      });
      guardarDatos();
      // Ordenar alfabéticamente por canción
      lista.sort(function(a, b) {
        return (a.cancion || '').localeCompare(b.cancion || '', 'es');
      });
      guardarDatos();
      actualizarSelectores();
      // Limpiar filtros para que la canción nueva sea visible
      buscador.value = '';
      filtroRitmo.value = '';
      filtroInterprete.value = '';
      dibujarTabla(lista);
      formulario.style.display = 'none';
      limpiarFormulario();
    });

    // 7. MODAL — editar y eliminar
    function abrirModal(indice) {
      indiceEditando = indice;
      const item = lista[indice];
      document.getElementById('editCancion').value    = item.cancion    || '';
      document.getElementById('editArtista').value    = item.artista    || '';   // corregido: editarArtista → editArtista
      document.getElementById('editRitmo').value      = item.ritmo      || '';
      document.getElementById('editInterprete').value = item.interprete || '';
      modal.style.display = 'flex';
    }

    function cerrarModal() {
      modal.style.display = 'none';
      indiceEditando = null;
    }

    btnCerrarModal.addEventListener('click', cerrarModal);

    btnGuardarEdicion.addEventListener('click', function() {
      const cancion = document.getElementById('editCancion').value.trim();
      if (cancion === '') {
        alert('El nombre de la canción no puede estar vacío.');
        return;
      }
      lista[indiceEditando] = {                                         // corregido: inidiceEditando → indiceEditando
        cancion:    cancion,
        artista:    document.getElementById('editArtista').value.trim()    || null,
        ritmo:      document.getElementById('editRitmo').value.trim()      || null,
        interprete: document.getElementById('editInterprete').value.trim() || null,
      };
      guardarDatos();
      actualizarSelectores();
      filtrar();
      cerrarModal();
    });

    btnEliminar.addEventListener('click', function() {
      const item = lista[indiceEditando];
      if (confirm('¿Eliminar "' + item.cancion + '"?')) {
        lista.splice(indiceEditando, 1);
        guardarDatos();
        actualizarSelectores();
        filtrar();
        cerrarModal();
      }
    });

    // Cerrar modal tocando fuera
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {    // corregido: e.targeet → e.target
        cerrarModal();
      }
    });

    // 8. EXPORTAR JSON
    btnExportar.addEventListener('click', function() {
      const texto = JSON.stringify(lista, null, 2);
      const blob  = new Blob([texto], { type: 'application/json' });
      const a     = document.createElement('a');
      a.href      = URL.createObjectURL(blob);
      a.download  = 'repertorio.json';
      a.click();
    });

    // 9. IMPORTAR JSON
    btnImportar.addEventListener('click', function() {
      inputImportar.click();
    });

    inputImportar.addEventListener('change', function() {
      const archivo = inputImportar.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = function(e) {
        try {
          const importado = JSON.parse(e.target.result);
          if (!Array.isArray(importado)) {
            alert('El archivo no tiene el formato correcto.');
            return;
          }
          if (confirm('Se importarán ' + importado.length + ' canciones. ¿Reemplazar la lista actual?')) {
            lista = importado;
            guardarDatos();
            actualizarSelectores();
            filtrar();
          }
        } catch (error) {
          alert('Error al leer el archivo. Asegúrate de que sea un JSON válido.');
        }
        inputImportar.value = '';
      };
      lector.readAsText(archivo);    // corregido: readText → readAsText
    });

    // 10. DESCARGAR HTML ACTUALIZADO
    document.getElementById('btnDescargarHTML').addEventListener('click', function() {

      // Construir bloque de datos con la lista actual
      const lineas = ['const canciones = ['];
      lista.forEach(function(item) {
        const cancion    = item.cancion    ? JSON.stringify(item.cancion)    : 'null';
        const artista    = item.artista    ? JSON.stringify(item.artista)    : 'null';
        const ritmo      = item.ritmo      ? JSON.stringify(item.ritmo)      : 'null';
        const interprete = item.interprete ? JSON.stringify(item.interprete) : 'null';
        lineas.push(
          '  { cancion: '   + cancion    +
          ', artista: '     + artista    +
          ', ritmo: '       + ritmo      +
          ', interprete: '  + interprete + ' },'
        );
      });
      lineas.push('];');
      const datosActualizados = lineas.join('\n');

      // Tomar el HTML completo de la página actual y reemplazar el bloque de datos
      const paginaCompleta = document.documentElement.outerHTML;
      const inicio = paginaCompleta.indexOf('const canciones = [');
      const fin    = paginaCompleta.indexOf('];', inicio) + 2;
      const htmlFinal = '<!DOCTYPE html>\n' +
        paginaCompleta.slice(0, inicio) +
        datosActualizados +
        paginaCompleta.slice(fin);

      const blob = new Blob([htmlFinal], { type: 'text/html' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = 'Repertorio_Baileys.html';
      a.click();
    });

    // 11. ARRANCAR
    actualizarSelectores();
    dibujarTabla(lista);

    // EVENTOS DE LOS FILTROS (faltaban)
    buscador.addEventListener('input', filtrar);
    filtroRitmo.addEventListener('change', filtrar);
    filtroInterprete.addEventListener('change', filtrar);
  </script>

</body>
</html>
